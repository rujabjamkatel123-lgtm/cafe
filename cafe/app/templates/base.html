<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         BASIC HTML SETTINGS
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Restaurant Management System
        {% endblock %}
    </title>


    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='images/logo.png') }}"
    >


    <!-- =====================================================
         MAIN CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >


    <!-- =====================================================
         PAGE-SPECIFIC CSS
    ====================================================== -->

    {% block extra_css %}
    {% endblock %}

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dashboard-polish.css') }}"
    >

</head>


<body>

    <!-- =====================================================
         MAIN PAGE CONTENT
    ====================================================== -->

    {% block content %}
    {% endblock %}


    <!-- =====================================================
         FLASH MESSAGES
         These can be displayed from any page.
    ====================================================== -->

    {% with messages = get_flashed_messages(
        with_categories=true
    ) %}

        {% if messages %}

            <div class="flash-container">

                {% for category, message in messages %}

                    <div
                        class="flash-message {{ category }}"
                    >

                        {{ message }}

                    </div>

                {% endfor %}

            </div>

        {% endif %}

    {% endwith %}


    <!-- =====================================================
         MAIN JAVASCRIPT
    ====================================================== -->

    <script
        src="{{ url_for('static', filename='js/script.js') }}"
    ></script>


    <!-- =====================================================
         PAGE-SPECIFIC JAVASCRIPT
    ====================================================== -->

    {% block extra_js %}
    {% endblock %}

</body>

</html>
